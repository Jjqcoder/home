<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/public/home.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>home</title>
        <style>
            /* 暗色护眼模式样式 - 使用!important确保最高优先级 */
            .eye-protection-mode {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.3) !important; /* 黑色半透明遮罩 */
                z-index: 2147483647 !important; /* 最大z-index值 */
                pointer-events: none !important; /* 确保不影响用户操作 */
            }

            /* 护眼模式切换按钮样式 */
            #eye-protection-toggle {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 2147483647;
                padding: 8px 16px;
                background-color: #333;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.2);
                font-family: Arial, sans-serif;
                transition: all 0.3s ease;
            }

            #eye-protection-toggle:hover {
                background-color: #555;
            }

            /* 暗色模式下按钮样式变化 */
            body.eye-protection-active #eye-protection-toggle {
                background-color: #666;
                box-shadow: 0 2px 12px 0 rgba(255, 255, 255, 0.1);
            }
        </style>
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>

        <!-- ================================护眼模式相关内容开始================================ -->
        <!-- 护眼模式切换按钮 -->
        <button id="eye-protection-toggle">暗色护眼</button>

        <script>
            // 初始化时检查LocalStorage中的设置
            document.addEventListener('DOMContentLoaded', function () {
                const body = document.body
                const toggleButton = document.getElementById('eye-protection-toggle')
                const savedMode = localStorage.getItem('eyeProtectionMode')

                if (savedMode === 'active') {
                    // 应用保存的护眼模式
                    body.classList.add('eye-protection-active')
                    const overlay = document.createElement('div')
                    overlay.className = 'eye-protection-mode'
                    document.body.appendChild(overlay)
                    toggleButton.textContent = '关闭护眼'
                }
            })

            // 护眼模式控制逻辑
            document.getElementById('eye-protection-toggle').addEventListener('click', function () {
                const body = document.body
                const isActive = body.classList.contains('eye-protection-active')

                if (isActive) {
                    // 关闭护眼模式
                    body.classList.remove('eye-protection-active')
                    const overlay = document.querySelector('.eye-protection-mode')
                    if (overlay) overlay.remove()
                    localStorage.setItem('eyeProtectionMode', 'inactive')
                    this.textContent = '暗色护眼'
                } else {
                    // 开启护眼模式
                    body.classList.add('eye-protection-active')
                    const overlay = document.createElement('div')
                    overlay.className = 'eye-protection-mode'
                    document.body.appendChild(overlay)
                    localStorage.setItem('eyeProtectionMode', 'active')
                    this.textContent = '关闭护眼'
                }
            })
        </script>
        <!-- ================================护眼模式相关内容结束================================ -->
    </body>
</html>
