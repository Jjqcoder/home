version: '3.8'

services:
  db-service:
    build: .
    container_name: db-service
    restart: always
    environment:
      - TZ=Asia/Shanghai
    cpus: 2                   # 限制CPU使用核数
    mem_limit: 1G             # 限制内存使用为1GB
    memswap_limit: 1.5G       # 限制交换内存为1.5GB（包含内存+交换区）
    logging:
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - ./:/usr/src/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"npm run start\" || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3