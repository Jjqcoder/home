# 此文件用于本地测试
# 如何执行此docker-compose?
# 创建容器
# docker compose -f docker-compose-dev.yml up --build -d
# 清理容器
# docker-compose -f docker-compose-dev.yml down --rmi all -v
services:

# 管理端项目开始 #
  manage-client:
    build:
      context: ./clients/manage-client-vue
      dockerfile: dockerfile-dev  # 指定使用开发版 dockerfile
    container_name: manage-client-vue
    ports:
      - "81:81"     # 管理端使用81端口
      - "444:444"    # 管理端使用444端口
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1G
    memswap_limit: 1.5G
  # 管理端项目结束 #
  
