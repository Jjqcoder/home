<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/home.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>home</title>
        <style>
            /* ==========美化全局的文字选中效果开始========== */
            ::selection {
                color: rgb(255, 0, 0); /* 字体颜色 */
                background-color: rgb(254, 213, 162); /* 背景颜色 */
                text-decoration: wavy underline; /* 波浪线 */
                /* text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); 文字阴影 */
            }
            /* ==========美化全局的文字选中效果结束========== */

            /* ==========鼠标样式美化开始========== */
            /* 设置指定的鼠标样式 */
            * {
                cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text x='0' y='32' font-size='32'>👆</text></svg>"),
                    auto !important;
            }
            /* ==========鼠标样式美化结束========== */
        </style>

        <script>
            /* ==========点击事件美化开始========== */
            /**
             * 添加美观的点击特效
             * @param {Object} options 配置选项
             * @param {number} [options.particleCount=25] 粒子数量
             * @param {string[]} [options.colors=['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFBE0B', '#FB5607', '#8338EC']] 粒子颜色数组
             * @param {number} [options.particleSizeMin=6] 粒子最小大小(px)
             * @param {number} [options.particleSizeMax=12] 粒子最大大小(px)
             * @param {number} [options.particleSpeed=8] 粒子基础速度
             * @param {string} [options.rippleColor='rgba(100, 200, 255, 0.6)'] 涟漪效果颜色
             * @param {number} [options.trailDensity=0.3] 拖尾粒子密度(0-1)
             */
            function addClickEffects(options = {}) {
                // 合并配置
                const config = {
                    particleCount: options.particleCount || 25,
                    colors: options.colors || ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFBE0B', '#FB5607', '#8338EC'],
                    particleSizeMin: options.particleSizeMin || 6,
                    particleSizeMax: options.particleSizeMax || 12,
                    particleSpeed: options.particleSpeed || 8,
                    rippleColor: options.rippleColor || 'rgba(100, 200, 255, 0.6)',
                    trailDensity: options.trailDensity || 0.3,
                    ...options
                }

                // 创建粒子元素
                function createParticle(x, y, color, size, angle, speedMultiplier = 1) {
                    const particle = document.createElement('div')
                    const sizeValue = size || config.particleSizeMin + Math.random() * (config.particleSizeMax - config.particleSizeMin)

                    particle.style.position = 'fixed'
                    particle.style.width = `${sizeValue}px`
                    particle.style.height = `${sizeValue}px`
                    particle.style.borderRadius = '50%'
                    particle.style.backgroundColor = color || config.colors[Math.floor(Math.random() * config.colors.length)]
                    particle.style.left = `${x}px`
                    particle.style.top = `${y}px`
                    particle.style.pointerEvents = 'none'
                    particle.style.zIndex = '9999'
                    particle.style.transform = 'translate(-50%, -50%)'
                    particle.style.boxShadow = '0 0 5px 1px rgba(255,255,255,0.5)'

                    document.body.appendChild(particle)
                    return particle
                }

                // 粒子爆炸效果
                function createParticleExplosion(x, y) {
                    for (let i = 0; i < config.particleCount; i++) {
                        const angle = Math.random() * Math.PI * 2
                        const speed = config.particleSpeed * (0.7 + Math.random() * 0.6)
                        const size = config.particleSizeMin + Math.random() * (config.particleSizeMax - config.particleSizeMin)
                        const color = config.colors[Math.floor(Math.random() * config.colors.length)]
                        const lifetime = 1000 + Math.random() * 500 // 1-1.5秒

                        const particle = createParticle(x, y, color, size)

                        // 添加发光效果
                        particle.style.filter = `blur(${Math.random() * 2}px)`

                        // 动画
                        const startTime = Date.now()
                        const xVelocity = Math.cos(angle) * speed
                        const yVelocity = Math.sin(angle) * speed
                        const rotationSpeed = (Math.random() - 0.5) * 20
                        let rotation = 0

                        function animate() {
                            const elapsed = Date.now() - startTime
                            const progress = elapsed / lifetime

                            if (progress >= 1) {
                                particle.remove()
                                return
                            }

                            // 抛物线运动
                            const xPos = x + xVelocity * elapsed * 0.03
                            const yPos = y + yVelocity * elapsed * 0.03 + (elapsed * 0.01) ** 2 * 0.5

                            // 旋转和淡出
                            rotation += rotationSpeed
                            const scale = 1 - progress * 0.5
                            const opacity = 1 - progress

                            particle.style.left = `${xPos}px`
                            particle.style.top = `${yPos}px`
                            particle.style.opacity = opacity
                            particle.style.transform = `translate(-50%, -50%) rotate(${rotation}deg) scale(${scale})`

                            requestAnimationFrame(animate)
                        }

                        animate()
                    }
                }

                // 涟漪效果
                function createRippleEffect(x, y) {
                    const ripple = document.createElement('div')
                    ripple.style.position = 'fixed'
                    ripple.style.width = '10px'
                    ripple.style.height = '10px'
                    ripple.style.borderRadius = '50%'
                    ripple.style.border = `2px solid ${config.rippleColor}`
                    ripple.style.left = `${x}px`
                    ripple.style.top = `${y}px`
                    ripple.style.pointerEvents = 'none'
                    ripple.style.zIndex = '9998'
                    ripple.style.transform = 'translate(-50%, -50%)'
                    ripple.style.boxShadow = `0 0 10px ${config.rippleColor}`

                    document.body.appendChild(ripple)

                    let size = 10
                    let opacity = 1
                    const duration = 800 // 0.8秒

                    function animate() {
                        size += 20
                        opacity -= 0.02

                        if (opacity <= 0) {
                            ripple.remove()
                            return
                        }

                        ripple.style.width = `${size}px`
                        ripple.style.height = `${size}px`
                        ripple.style.opacity = opacity
                        ripple.style.borderWidth = `${2 + size * 0.02}px`

                        requestAnimationFrame(animate)
                    }

                    animate()
                }

                // 鼠标拖尾效果
                let lastPoints = []
                const maxTrailPoints = 8

                document.addEventListener('mousemove', e => {
                    // 记录鼠标位置
                    lastPoints.push({x: e.clientX, y: e.clientY, time: Date.now()})
                    if (lastPoints.length > maxTrailPoints) {
                        lastPoints.shift()
                    }

                    // 创建拖尾粒子
                    if (Math.random() < config.trailDensity && lastPoints.length > 2) {
                        const point = lastPoints[0]
                        const elapsed = Date.now() - point.time
                        if (elapsed > 50) return // 只对较新的点添加拖尾

                        const size = config.particleSizeMin * 0.7 + Math.random() * (config.particleSizeMax * 0.7 - config.particleSizeMin * 0.7)
                        const color = config.colors[Math.floor(Math.random() * config.colors.length)]
                        const particle = createParticle(point.x, point.y, color, size)

                        // 拖尾粒子动画
                        let opacity = 0.6
                        const lifetime = 500 + Math.random() * 300 // 0.5-0.8秒
                        const startTime = Date.now()

                        function animate() {
                            const elapsed = Date.now() - startTime
                            const progress = elapsed / lifetime

                            if (progress >= 1) {
                                particle.remove()
                                return
                            }

                            opacity = 0.6 * (1 - progress)
                            const scale = 1 - progress * 0.5

                            particle.style.opacity = opacity
                            particle.style.transform = `translate(-50%, -50%) scale(${scale})`

                            requestAnimationFrame(animate)
                        }

                        animate()
                    }
                })

                // 点击事件
                document.addEventListener('click', e => {
                    createParticleExplosion(e.clientX, e.clientY)
                    // createRippleEffect(e.clientX, e.clientY) 取消涟漪效果
                })
            }

            // 使用
            addClickEffects({
                colors: ['#FF9E7D', '#FFBB7C', '#FFD67F', '#A4DC85', '#6CC3D5'],
                particleCount: 10,
                trailDensity: 0.4
            })
            /* ==========点击事件美化结束========== */
        </script>

        <style>
            /* 新增入场动画样式 */
            .loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #1a1a1a;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 2147483646; /* 仅次于护眼模式的层级 */
                transition: 1s ease;
            }

            .loading-screen.hide {
                opacity: 0;
                transform: translateY(-100%);
            }

            .loading-logo {
                width: 20%; /* 根据屏幕宽度调整 */
                aspect-ratio: 1 / 1; /* 宽高比为1:1 */
                border-radius: 50%; /* 使logo变为圆形 */
                animation: logoFloat 2s ease-in-out infinite, glowEffect 3s ease-in-out infinite;
                /* 添加金色的渐变光晕效果 */
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)) /* 金色光晕 */ drop-shadow(0 0 15px rgba(255, 215, 0, 0.2)); /* 金色光晕 */
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); /* 金色光晕 */
                /* 设置图片不可选中 */
                user-select: none;
                /* 设置图片不可拖动 */
                pointer-events: none;
            }

            /* 添加一个动画效果，使光晕动态变化 */
            @keyframes glowEffect {
                0% {
                    filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)) drop-shadow(0 0 15px rgba(255, 215, 0, 0.2));
                }
                50% {
                    filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.35)) drop-shadow(0 0 17px rgba(255, 215, 0, 0.25));
                }
                100% {
                    filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)) drop-shadow(0 0 15px rgba(255, 215, 0, 0.2));
                }
            }

            .loading-logo {
                animation: logoFloat 2s ease-in-out infinite, glowEffect 3s ease-in-out infinite;
            }

            .loading-text {
                color: white;
                margin-top: 30px;
                font-size: 1.2em;
                letter-spacing: 2px;
                opacity: 0.8;
                animation: textPulse 1.5s ease-in-out infinite;
                /* 设置内容不可选中 */
                user-select: none;
            }

            @keyframes textPulse {
                0%,
                100% {
                    opacity: 0.6;
                }
                50% {
                    opacity: 1;
                }
            }

            .scroll-hint {
                position: absolute;
                bottom: 40px;
                display: flex;
                flex-direction: column;
                align-items: center;
                color: rgba(255, 255, 255, 0.7);
            }

            .scroll-hint span {
                margin-bottom: 10px;
            }

            @keyframes wheelScroll {
                0% {
                    transform: translateY(0);
                    opacity: 0.5;
                }
                30% {
                    transform: translateY(10px);
                    opacity: 1;
                }
                100% {
                    transform: translateY(20px);
                    opacity: 0.5;
                }
            }

            /* 暗色模式开启后的样式 */
            .eye-protection-mode {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.5) !important; /* 黑色半透明遮罩 */
                z-index: 2147483647 !important; /* 最大z-index值 */
                pointer-events: none !important; /* 确保不影响用户操作 */
            }

            /* 护眼模式切换按钮样式 - 初始隐藏 */
            #eye-protection-toggle {
                display: none; /* 初始隐藏 */
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 2147483647;
                padding: 8px 16px;
                background-color: #333;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.2);
                font-family: Arial, sans-serif;
                transition: all 0.3s ease;
            }

            #eye-protection-toggle:hover {
                background-color: #555;
            }

            /* 暗色模式下按钮样式变化 */
            body.eye-protection-active #eye-protection-toggle {
                background-color: #000; /* 纯黑色 */
                box-shadow: 0 0 20px 15px rgba(0, 0, 0, 1); /* 增大模糊半径和扩展半径 */
            }
        </style>
    </head>

    <body>
        <!-- 入场动画结构开始 -->
        <div class="loading-screen">
            <img src="/windy.jpg" class="loading-logo" alt="windy" />
            <div class="loading-text">Hello, traveler!🍃</div>
            <div class="scroll-hint"></div>
        </div>
        <!-- 入场动画结构结束 -->

        <!-- 原有内容开始 -->
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
        <!-- 原有内容结束 -->

        <!-- 入场动画控制脚本开始 -->
        <script>
            // 入场动画控制
            document.addEventListener('DOMContentLoaded', () => {
                const loadingScreen = document.querySelector('.loading-screen')
                let isAnimationDone = false

                // 隐藏滚动条
                document.body.style.overflow = 'hidden'

                // 首次点击处理
                function handleFirstClick() {
                    if (!isAnimationDone) {
                        loadingScreen.classList.add('hide')
                        setTimeout(() => {
                            loadingScreen.remove()
                            isAnimationDone = true
                            // 恢复滚动条
                            document.body.style.overflow = 'auto'
                            // 显示暗色模式按钮
                            document.getElementById('eye-protection-toggle').style.display = 'block'
                        }, 1000)
                        document.removeEventListener('click', handleFirstClick)
                    }
                }

                // 等待1秒后允许滚动关闭
                setTimeout(() => {
                    // window.addEventListener('wheel', handleFirstScroll, {passive: false})
                    document.addEventListener('click', handleFirstClick)
                }, 1000)
            })
        </script>
        <!-- 入场动画控制脚本结束 -->

        <!-- ================================护眼模式相关内容（保持不变）================================ -->
        <button id="eye-protection-toggle">暗色护眼</button>
        <script>
            // 初始化时检查LocalStorage中的设置
            document.addEventListener('DOMContentLoaded', function () {
                const body = document.body
                const toggleButton = document.getElementById('eye-protection-toggle')
                const savedMode = localStorage.getItem('eyeProtectionMode')

                if (savedMode === 'active') {
                    // 应用保存的护眼模式
                    body.classList.add('eye-protection-active')
                    const overlay = document.createElement('div')
                    overlay.className = 'eye-protection-mode'
                    document.body.appendChild(overlay)
                    toggleButton.textContent = '关闭护眼'
                }
            })

            // 护眼模式控制逻辑
            document.getElementById('eye-protection-toggle').addEventListener('click', function () {
                const body = document.body
                const isActive = body.classList.contains('eye-protection-active')

                if (isActive) {
                    // 关闭护眼模式
                    body.classList.remove('eye-protection-active')
                    const overlay = document.querySelector('.eye-protection-mode')
                    if (overlay) overlay.remove()
                    localStorage.setItem('eyeProtectionMode', 'inactive')
                    this.textContent = '暗色护眼'
                } else {
                    // 开启护眼模式
                    body.classList.add('eye-protection-active')
                    const overlay = document.createElement('div')
                    overlay.className = 'eye-protection-mode'
                    document.body.appendChild(overlay)
                    localStorage.setItem('eyeProtectionMode', 'active')
                    this.textContent = '关闭护眼'
                }
            })
        </script>
    </body>
</html>
