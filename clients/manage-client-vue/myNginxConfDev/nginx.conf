worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 关键配置：加载 MIME 类型定义文件
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;  # 默认类型（避免 fallback 到 text/plain）

    server {
        listen       81;
        server_name  localhost;
        root         /usr/share/nginx/html;  # 前端文件根目录

        location / {
            try_files $uri $uri/ /index.html;  # 支持前端路由（如 React/Vue）
        }

        # 强制 JS 文件返回正确的 MIME 类型（解决模块加载问题）
        location ~ \.js$ {
            types { }  # 清除默认 MIME 类型
            default_type application/javascript;
            add_header Content-Type application/javascript;
        }
    }
}